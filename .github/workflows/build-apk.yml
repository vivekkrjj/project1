name: Build Android APK
# Rebuild requested for current website app URL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Build APK
        run: |
          cd android
          gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BhumiNursingCollege-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish permanent APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$APK#BhumiNursingCollege.apk" --clobber
          else
            gh release create android-latest "$APK#BhumiNursingCollege.apk"               --title "Bhumi Nursing College Android App"               --notes "Latest Android APK. This release is automatically updated after successful builds from main."
          fi
