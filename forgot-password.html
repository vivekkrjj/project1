<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password - Bhumi Nursing College</title><link rel="stylesheet" href="style.css?v=20260903"><link rel="stylesheet" href="portal.css?v=20260903"></head><body class="portal-page student-portal"><div class="portal-shell"><div class="portal-brand"><img src="logo.png?v=20260903" alt="Bhumi Nursing College logo" class="portal-logo"><div><h1>Bhumi Nursing College</h1><p>Student Portal</p></div></div><div class="auth-card"><h2>Forgot Password</h2><p>Enter your registered email address. We will send a secure password reset link.</p><label>Registered Email<input id="resetEmail" type="email" autocomplete="email" placeholder="student@example.com"></label><button id="sendReset" class="primary-btn">Send Reset Link</button><div id="resetMsg" class="success"></div><div id="resetError" class="error"></div><a href="student.html">← Back to Student Login</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260903"></script><script src="app.js?v=20260903"></script><script>document.getElementById('sendReset').onclick=async()=>{const email=document.getElementById('resetEmail').value.trim();const msg=document.getElementById('resetMsg'),err=document.getElementById('resetError');msg.textContent='';err.textContent='';if(!email){err.textContent='Please enter your registered email.';return}if(!isDbReady()){err.textContent='Supabase is not configured.';return}const {error}=await bhumiDb.auth.resetPasswordForEmail(email,{redirectTo:new URL('update-password.html',location.href).href});if(error){err.textContent=error.message;return}msg.textContent='If this email is registered, a password reset link has been sent. Please check your inbox.'};</script></body></html>
