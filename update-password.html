<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set New Password - Bhumi Nursing College</title><link rel="stylesheet" href="style.css?v=20260903"><link rel="stylesheet" href="portal.css?v=20260903"></head><body class="portal-page student-portal"><div class="portal-shell"><div class="portal-brand"><img src="logo.png?v=20260903" alt="Bhumi Nursing College logo" class="portal-logo"><div><h1>Bhumi Nursing College</h1><p>Student Portal</p></div></div><div class="auth-card"><h2>Set New Password</h2><p>Choose a new password for your student account.</p><label>New Password<input id="newPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Minimum 6 characters"></label><label>Confirm Password<input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Re-enter password"></label><button id="updatePassword" class="primary-btn">Update Password</button><div id="updateMsg" class="success"></div><div id="updateError" class="error"></div><a href="student.html">← Student Login</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260903"></script><script src="app.js?v=20260903"></script><script>let recoveryReady=false;bhumiDb?.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY') recoveryReady=true});document.getElementById('updatePassword').onclick=async()=>{const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value,msg=document.getElementById('updateMsg'),err=document.getElementById('updateError');msg.textContent='';err.textContent='';if(p.length<6){err.textContent='Password must be at least 6 characters.';return}if(p!==c){err.textContent='Passwords do not match.';return}if(!isDbReady()){err.textContent='Supabase is not configured.';return}const {data,error}=await bhumiDb.auth.updateUser({password:p});if(error){err.textContent=error.message;return}msg.textContent='Password updated successfully. You can now login with your new password.';setTimeout(()=>location.href='student.html',1500)};</script></body></html>
