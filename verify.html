<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Verification | Bhumi Nursing College</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8ff;color:#172033}.wrap{max-width:760px;margin:35px auto;padding:20px}.card{background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(17,47,95,.12);overflow:hidden;border:1px solid #dbe7f5}.head{display:flex;gap:16px;align-items:center;padding:20px;background:#f4f7ff;border-bottom:3px solid #1f3c88}.head img{width:72px;height:58px;object-fit:contain}.head strong{display:block;font-size:23px;color:#173f86}.head span{display:block;font-size:12px;margin-top:5px;color:#5d6d82}.verified{margin-left:auto;background:#e7f8ed;color:#16713a;border:1px solid #b8e5c7;padding:7px 10px;border-radius:999px;font-weight:800;font-size:11px;white-space:nowrap}.body{padding:24px}.title{text-align:center;margin:0 0 20px;color:#173f86}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.item{border:1px solid #e0e8f2;border-radius:12px;padding:13px;background:#fbfdff}.item small{display:block;color:#718096;font-size:10px;font-weight:800;letter-spacing:.7px;margin-bottom:5px}.item b{font-size:15px;word-break:break-word}.note{margin-top:20px;padding:12px 14px;background:#f7f9fc;border-radius:10px;color:#5f6f83;font-size:12px;line-height:1.5}.err{text-align:center;padding:45px 20px}.err h2{color:#b42318}.foot{text-align:center;padding:13px;border-top:1px solid #e0e8f2;color:#718096;font-size:11px}@media(max-width:600px){.wrap{margin:12px auto;padding:10px}.head{padding:15px}.head strong{font-size:17px}.verified{font-size:9px}.grid{grid-template-columns:1fr}.body{padding:17px}}
</style></head><body><div class="wrap"><div class="card" id="app"></div></div>
<script>
(function(){
const app=document.getElementById('app');
function esc(v){return String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]);}
function decode(s){try{const bin=atob(s.replace(/-/g,'+').replace(/_/g,'/'));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes));}catch(e){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch(e2){return null}}}
const raw=new URLSearchParams(location.search).get('student'),d=raw?decode(raw):null;
if(!d){app.innerHTML='<div class="err"><h2>Student details not found</h2><p>This QR code is invalid or incomplete.</p></div>';return;}
app.innerHTML=`<div class="head"><img src="assets/bhumi-nursing-college-logo.png" alt="Bhumi Nursing College"><div><strong>BHUMI NURSING COLLEGE</strong><span>Near Government Referral Hospital, Lalganj, Vaishali, Bihar</span></div><div class="verified">STUDENT DETAILS</div></div><div class="body"><h2 class="title">Student Identity / Verification Details</h2><div class="grid"><div class="item"><small>NAME</small><b>${esc(d.name)}</b></div><div class="item"><small>COURSE</small><b>${esc(d.course)}</b></div><div class="item"><small>ROLL NUMBER</small><b>${esc(d.roll)}</b></div><div class="item"><small>REGISTRATION ID</small><b>${esc(d.registration_id)}</b></div><div class="item"><small>DATE OF BIRTH</small><b>${esc(d.dob)}</b></div><div class="item"><small>EMAIL</small><b>${esc(d.email)}</b></div><div class="item"><small>MOBILE</small><b>${esc(d.mobile)}</b></div><div class="item"><small>STATUS</small><b>${esc(d.status||'APPROVED')}</b></div></div><div class="note">This page was opened from the student's QR code on the Bhumi Nursing College ID Card. The details shown are the information encoded when the ID card was generated.</div></div><div class="foot">Bhumi Nursing College • Student Identity Card</div>`;
})();
</script></body></html>
